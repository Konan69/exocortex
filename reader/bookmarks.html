<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmarks — Field Theory</title>
<style>
  :root {
    --bg: #fafafa; --surface: #fff; --surface2: #f0f0f8; --border: #e0e0ea;
    --text: #1a1a2e; --text2: #5a5a78; --text3: #9898b0;
    --accent: #4f6ef7; --accent2: #e8506c; --link: #3b82f6;
    --tag-bg: #eef0ff; --tag-text: #5a5fc0;
    --new: #4f6ef7; --triaged: #f59e0b; --done: #10b981;
    --hi: #ef4444; --med: #f59e0b; --lo: #6b7280;
    --shadow: 0 2px 16px rgba(0,0,0,0.08);
    --radius: 12px; --radius-sm: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; }

  /* ── TABS ── */
  .tab-bar { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .tab-btn { padding:10px 24px; border:none; background:transparent; color:var(--text3); font-size:0.9rem; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; transition:0.2s; }
  .tab-btn:hover { color:var(--accent); }
  .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }

  /* ── SIDEBAR ── */
  aside { width:380px; min-width:380px; height:100vh; display:flex; flex-direction:column; background:var(--surface); border-right:1px solid var(--border); }
  .sidebar-header { padding:18px 20px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .sidebar-header h1 { font-size:1.3rem; font-weight:700; letter-spacing:-0.02em; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .sidebar-header .stats { font-size:0.78rem; color:var(--text3); margin-top:4px; }
  .search-box { margin-top:12px; position:relative; }
  .search-box input { width:100%; padding:10px 12px 10px 36px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-size:0.9rem; outline:none; }
  .search-box input:focus { border-color:var(--accent); }
  .search-box svg { position:absolute; left:10px; top:10px; width:16px; height:16px; color:var(--text3); }
  .filters { display:flex; gap:6px; padding:10px 20px; flex-shrink:0; flex-wrap:wrap; border-bottom:1px solid var(--border); }
  .filter-btn { padding:5px 12px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--text2); font-size:0.75rem; cursor:pointer; transition:0.2s; white-space:nowrap; }
  .filter-btn:hover { border-color:var(--accent); color:var(--accent); }
  .filter-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .group-row { display:flex; gap:6px; padding:8px 20px; flex-shrink:0; border-bottom:1px solid var(--border); align-items:center; }
  .group-row label { font-size:0.72rem; color:var(--text3); margin-right:4px; }
  .group-row select { font-size:0.75rem; padding:4px 8px; border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--text); outline:none; }
  .list-container { flex:1; overflow-y:auto; }
  .list-container::-webkit-scrollbar { width:4px; }
  .list-container::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .group-header { padding:10px 20px; font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent); background:var(--surface2); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:1; }
  .bm-item { padding:10px 20px; cursor:pointer; border-bottom:1px solid rgba(224,224,234,0.5); transition:0.2s; display:flex; gap:10px; align-items:flex-start; }
  .bm-item:hover { background:var(--surface2); }
  .bm-item.active { background:var(--surface2); border-left:3px solid var(--accent); }
  .bm-item .bm-status { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:6px; }
  .bm-item .bm-status.new { background:var(--new); }
  .bm-item .bm-status.triaged { background:var(--triaged); }
  .bm-item .bm-status.done { background:var(--done); }
  .bm-item .bm-content { flex:1; min-width:0; }
  .bm-item .bm-header { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .bm-item .avatar { width:24px; height:24px; border-radius:50%; object-fit:cover; background:var(--border); flex-shrink:0; }
  .bm-item .author { font-size:0.8rem; font-weight:600; }
  .bm-item .handle { font-size:0.7rem; color:var(--text3); }
  .bm-item .bm-text { font-size:0.78rem; color:var(--text2); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .bm-item .bm-meta { display:flex; gap:8px; margin-top:4px; font-size:0.68rem; color:var(--text3); flex-wrap:wrap; }
  .bm-item .bm-meta .prio { padding:1px 6px; border-radius:8px; font-weight:600; }
  .bm-item .bm-meta .prio.high { background:#fef2f2; color:var(--hi); }
  .bm-item .bm-meta .prio.medium { background:#fffbeb; color:var(--med); }
  .bm-item .bm-meta .prio.low { background:#f3f4f6; color:var(--lo); }

  /* ── MAIN ── */
  main { flex:1; height:100vh; overflow-y:auto; }
  main::-webkit-scrollbar { width:4px; }
  main::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .empty-state { flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; color:var(--text3); height:100%; gap:12px; }
  .detail { max-width:820px; margin:0 auto; padding:32px 40px; width:100%; }
  .detail-top { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .detail-top .avatar { width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--border); }
  .detail-top .name { font-size:1rem; font-weight:700; }
  .detail-top .handle { font-size:0.8rem; color:var(--text3); }
  .detail-text { font-size:1rem; line-height:1.6; margin-bottom:16px; white-space:pre-wrap; word-break:break-word; }
  .detail-text a { color:var(--link); text-decoration:none; }
  .detail-text a:hover { text-decoration:underline; }
  .triage-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 16px; background:var(--surface2); border-radius:var(--radius-sm); margin-bottom:16px; }
  .triage-bar label { font-size:0.75rem; font-weight:600; color:var(--text3); }
  .triage-bar select, .triage-bar input { font-size:0.8rem; padding:5px 10px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--text); outline:none; }
  .triage-bar select:focus, .triage-bar input:focus { border-color:var(--accent); }
  .status-badge { padding:5px 14px; border-radius:16px; font-size:0.75rem; font-weight:600; cursor:pointer; border:none; transition:0.2s; }
  .status-badge.new { background:#eef2ff; color:var(--new); }
  .status-badge.triaged { background:#fff7ed; color:var(--triaged); }
  .status-badge.done { background:#ecfdf5; color:var(--done); }
  .quoted-block { border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 18px; margin-bottom:16px; background:var(--surface); }
  .quoted-block .qt-author { font-weight:600; font-size:0.88rem; }
  .quoted-block .qt-text { font-size:0.85rem; color:var(--text2); margin-top:6px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .media-section { margin-bottom:20px; }
  .media-section h3, .links-section h3, .articles-section h3 { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text3); margin-bottom:10px; }
  .media-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px; }
  .media-card { border-radius:var(--radius-sm); overflow:hidden; background:var(--surface); border:1px solid var(--border); cursor:pointer; transition:0.2s; }
  .media-card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:var(--shadow); }
  .media-card img { width:100%; height:140px; object-fit:cover; display:block; }
  .links-section { margin-bottom:20px; }
  .link-row { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--surface); border-radius:var(--radius-sm); margin-bottom:6px; border:1px solid var(--border); }
  .link-row .link-domain { color:var(--text3); font-size:0.7rem; }
  .link-row a { color:var(--link); text-decoration:none; font-size:0.82rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .link-row a:hover { text-decoration:underline; }
  .extract-btn { padding:4px 12px; border-radius:14px; border:1px solid var(--accent); background:transparent; color:var(--accent); font-size:0.72rem; cursor:pointer; transition:0.2s; white-space:nowrap; }
  .extract-btn:hover { background:var(--accent); color:#fff; }
  .extract-btn.loading { opacity:0.5; pointer-events:none; }

  /* ── ARTICLES TAB ── */
  .article-card { padding:20px 24px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px; cursor:pointer; transition:0.2s; }
  .article-card:hover { border-color:var(--accent); box-shadow:var(--shadow); }
  .article-card .art-title { font-size:1rem; font-weight:700; color:var(--text); margin-bottom:4px; }
  .article-card .art-domain { font-size:0.72rem; color:var(--accent); margin-bottom:8px; }
  .article-card .art-excerpt { font-size:0.82rem; color:var(--text2); line-height:1.5; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .article-card .art-meta { display:flex; gap:12px; margin-top:8px; font-size:0.7rem; color:var(--text3); }
  .article-detail { max-width:820px; margin:0 auto; padding:32px 40px; }
  .article-detail h2 { font-size:1.4rem; font-weight:700; margin-bottom:8px; line-height:1.3; }
  .article-detail .art-source { font-size:0.82rem; color:var(--text3); margin-bottom:20px; }
  .article-detail .art-content { font-size:0.95rem; line-height:1.8; color:var(--text); white-space:pre-wrap; word-break:break-word; }
  .article-detail .back-btn { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:16px; border:1px solid var(--border); background:transparent; color:var(--text2); cursor:pointer; font-size:0.8rem; margin-bottom:20px; transition:0.2s; }
  .article-detail .back-btn:hover { border-color:var(--accent); color:var(--accent); }
  .article-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; padding:20px; }

  /* articles sidebar */
  .art-item { padding:12px 20px; cursor:pointer; border-bottom:1px solid rgba(224,224,234,0.5); transition:0.2s; }
  .art-item:hover { background:var(--surface2); }
  .art-item.active { background:var(--surface2); border-left:3px solid var(--accent2); }
  .art-item .art-item-title { font-size:0.82rem; font-weight:600; color:var(--text); margin-bottom:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .art-item .art-item-domain { font-size:0.68rem; color:var(--accent); }

  .tag-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .tag-row .tag { padding:3px 12px; border-radius:16px; background:var(--tag-bg); color:var(--tag-text); font-size:0.73rem; }
  .detail-meta { display:flex; gap:16px; font-size:0.78rem; color:var(--text3); flex-wrap:wrap; padding-top:12px; border-top:1px solid var(--border); }
  .detail-meta a { color:var(--link); text-decoration:none; }
  .detail-meta a:hover { text-decoration:underline; }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:1000; display:none; align-items:center; justify-content:center; cursor:pointer; }
  .lightbox.open { display:flex; }
  .lightbox img { max-width:92vw; max-height:92vh; border-radius:12px; }
  .lightbox .close { position:absolute; top:20px; right:20px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.15); border:none; color:#fff; font-size:1.3rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  @media(max-width:768px) { body { flex-direction:column; } aside { width:100%; min-width:unset; height:40vh; } main { height:60vh; } .detail,.article-detail { padding:16px; } .article-grid { grid-template-columns:1fr; padding:12px; } }
</style>
</head>
<body>

<aside>
  <div class="sidebar-header">
    <h1 id="sidebarTitle">✦ Bookmarks</h1>
    <div class="stats" id="statsLine">Loading…</div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search…">
    </div>
  </div>

  <div class="filters" id="statusFilters">
    <button class="filter-btn active" data-status="">All</button>
    <button class="filter-btn" data-status="new">New</button>
    <button class="filter-btn" data-status="triaged">Triaged</button>
    <button class="filter-btn" data-status="done">Done</button>
  </div>

  <div class="group-row">
    <label>Group:</label>
    <select id="groupBy">
      <option value="">None</option>
      <option value="category">Category</option>
      <option value="status">Status</option>
      <option value="priority">Priority</option>
      <option value="domain">Domain</option>
    </select>
  </div>

  <div class="list-container" id="sidebarList"></div>
</aside>

<main id="mainPanel">
  <div class="tab-bar" style="padding:0 40px;padding-top:20px;">
    <button class="tab-btn active" data-tab="bookmarks">Bookmarks</button>
    <button class="tab-btn" data-tab="articles">Articles</button>
  </div>
  <div class="empty-state" id="emptyState">
    <p>Select an item to view details</p>
  </div>
</main>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="close" onclick="closeLightbox()">✕</button>
  <div id="lightboxContent"></div>
</div>

<script>
const API = '';
let allBookmarks = [], allArticles = [];
let currentTab = 'bookmarks', currentStatus = '', currentGroup = '', selectedId = null, currentDetail = null;

async function init() {
  await loadStats();
  await loadBookmarks();
  await loadArticles();
  document.getElementById('searchInput').addEventListener('input', debounce(renderList,200));
  document.getElementById('groupBy').addEventListener('change', e => { currentGroup = e.target.value; renderList(); });
  document.querySelectorAll('#statusFilters .filter-btn').forEach(btn => btn.addEventListener('click',() => {
    document.querySelectorAll('#statusFilters .filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); currentStatus = btn.dataset.status; renderList();
  }));
  document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click',() => {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); currentTab = btn.dataset.tab;
    document.getElementById('sidebarTitle').textContent = currentTab==='articles' ? '✦ Articles' : '✦ Bookmarks';
    document.getElementById('searchInput').value = '';
    currentStatus = ''; currentGroup = '';
    document.querySelectorAll('#statusFilters .filter-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector('#statusFilters .filter-btn[data-status=""]')?.classList.add('active');
    document.getElementById('statusFilters').style.display = currentTab==='articles' ? 'none' : '';
    document.getElementById('groupBy').closest('.group-row').style.display = currentTab==='articles' ? 'none' : '';
    selectedId = null;
    document.getElementById('mainPanel').querySelector('.detail')?.remove();
    document.getElementById('mainPanel').querySelector('.article-detail')?.remove();
    document.getElementById('mainPanel').querySelector('.article-grid')?.remove();
    document.getElementById('emptyState').style.display = '';
    renderList();
  }));
  document.addEventListener('keydown', e => { if(e.key==='Escape') closeLightbox(); });
}

async function loadStats() {
  try { const r = await fetch(API+'/api/stats'); const s = await r.json();
    document.getElementById('statsLine').textContent = s.total+' bookmarks · '+s.with_media+' w/ media · '+s.with_links+' w/ links · articles: '+(s.articles||0);
  } catch(e) { document.getElementById('statsLine').textContent = 'Could not load stats'; }
}

async function loadBookmarks() {
  try { const p = new URLSearchParams(); if(currentStatus) p.set('status',currentStatus); if(currentGroup) p.set('group',currentGroup);
    const r = await fetch(API+'/api/bookmarks?'+p); const d = await r.json();
    allBookmarks = (currentGroup && typeof d==='object' && !Array.isArray(d)) ? d : (Array.isArray(d)?d:[]); }
  catch(e) { allBookmarks = []; }
}

async function loadArticles() { try { const r = await fetch(API+'/api/articles'); allArticles = await r.json(); } catch(e) { allArticles = []; } }

function renderList() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const list = document.getElementById('sidebarList');
  if (currentTab === 'articles') { renderArticleList(search); return; }
  if (currentGroup && typeof allBookmarks==='object' && !Array.isArray(allBookmarks)) {
    let html = ''; const groups = Object.keys(allBookmarks).sort();
    for (const g of groups) { let items = allBookmarks[g]; if(search) items = items.filter(b=>matchesSearch(b,search)); if(!items.length) continue;
      html += '<div class="group-header">'+esc(g)+' ('+items.length+')</div>'; html += items.map(renderBmItem).join(''); }
    list.innerHTML = html || '<div style="padding:40px;text-align:center;color:var(--text3)">No bookmarks</div>';
  } else {
    let items = Array.isArray(allBookmarks) ? allBookmarks : [];
    if(search) items = items.filter(b=>matchesSearch(b,search));
    list.innerHTML = items.length ? items.map(renderBmItem).join('') : '<div style="padding:40px;text-align:center;color:var(--text3)">No bookmarks</div>';
  }
}

function renderArticleList(search) {
  const list = document.getElementById('sidebarList');
  let items = allArticles;
  if (search) items = items.filter(a => (a.title||'').toLowerCase().includes(search) || (a.domain||'').toLowerCase().includes(search));
  list.innerHTML = items.length ? items.map(a => '<div class="art-item'+(a.id===selectedId?' active':'')+'" data-id="'+a.id+'" onclick="selectArticle('+a.id+')"><div class="art-item-title">'+esc(a.title||'Untitled')+'</div><div class="art-item-domain">'+esc(a.domain||'')+' · '+esc(a.word_count||0)+' words</div></div>').join('') : '<div style="padding:40px;text-align:center;color:var(--text3)">No articles yet. Extract a link from a bookmark first.</div>';
}

function renderBmItem(b) {
  const hasMedia = (b.media||[]).length > 0, hasLinks = (b.links||[]).length > 0;
  const qtCount = (b.quoted_tweets||[]).length, artCount = (b.articles||[]).length, prio = b.priority||'medium';
  return '<div class="bm-item'+(b.id===selectedId?' active':'')+'" data-id="'+b.id+'" onclick="selectBookmark(\''+b.id+'\')"><div class="bm-status '+(b.status||'new')+'"></div><div class="bm-content"><div class="bm-header"><img class="avatar" src="'+esc(b.author_img||'')+'" loading="lazy" onerror="this.style.display=\'none\'"><span class="author">'+esc(b.author_name||'Unknown')+'</span><span class="handle">@'+esc(b.author_handle||'')+'</span></div><div class="bm-text">'+esc(b.text||'(no text)')+'</div><div class="bm-meta"><span class="prio '+prio+'">'+prio+'</span>'+(hasMedia?'<span>🖼 '+b.media.length+'</span>':'')+(hasLinks?'<span>🔗 '+b.links.length+'</span>':'')+(qtCount?'<span>💬 '+qtCount+'</span>':'')+(artCount?'<span>📄 '+artCount+'</span>':'')+(b.category?'<span>📁 '+esc(b.category)+'</span>':'')+'</div></div></div>';
}

function matchesSearch(b, q) { return (b.text||'').toLowerCase().includes(q) || (b.author_name||'').toLowerCase().includes(q) || (b.author_handle||'').toLowerCase().includes(q) || (b.tags||[]).some(t=>t.toLowerCase().includes(q)); }

async function selectBookmark(id) {
  selectedId = id; renderList(); document.getElementById('emptyState').style.display = 'none';
  try { const r = await fetch(API+'/api/bookmarks/'+id); if(!r.ok) throw new Error(); currentDetail = await r.json(); renderBmDetail(); }
  catch(e) { const el = document.createElement('div'); el.className='empty-state'; el.innerHTML='<p>Error loading</p>'; document.getElementById('mainPanel').appendChild(el); }
}

function renderBmDetail() {
  const b = currentDetail; if(!b) return;
  const main = document.getElementById('mainPanel');
  main.querySelector('.detail')?.remove(); main.querySelector('.article-detail')?.remove(); main.querySelector('.article-grid')?.remove();

  const detail = document.createElement('div'); detail.className = 'detail';
  let quotedHtml = '';
  if (!b.notes && b.quoted_tweets && b.quoted_tweets.length)
    quotedHtml = b.quoted_tweets.map(qt => '<div class="quoted-block"><div class="qt-author">'+esc(qt.author_name||'')+' @'+esc(qt.author_handle||'')+'</div><div class="qt-text">'+linkify(esc(qt.text||''))+'</div></div>').join('');

  let mediaHtml = '';
  if (b.media && b.media.length)
    mediaHtml = '<div class="media-section"><h3>Media ('+b.media.length+')</h3><div class="media-grid">'+b.media.slice(0,8).map(url=>'<div class="media-card" onclick="event.stopPropagation();openLightbox(\''+esc(url)+'\')"><img src="'+esc(url)+'" loading="lazy" onerror="this.parentElement.style.display=\'none\'"></div>').join('')+'</div></div>';

  let linksHtml = '';
  if (b.links && b.links.length)
    linksHtml = '<div class="links-section"><h3>Links ('+b.links.length+')</h3>'+b.links.map(l=>{
      const hasArticle = (b.articles||[]).some(a=>a.link_id==l.id);
      const hasContent = l.extracted_content && l.extraction_status==='done';
      return '<div class="link-row"><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.display_url||l.url)+'</a><span class="link-domain">'+esc(l.domain||'')+'</span>'+(hasArticle?'<span style="color:var(--accent2);font-size:0.7rem;">📄 article</span>':'<button class="extract-btn" onclick="event.stopPropagation();extractLink(\''+esc(b.id)+'\',\''+esc(l.id)+'\',this)">📥 Extract</button>')+'</div>';
    }).join('')+'</div>';

  let articlesHtml = '';
  if (b.articles && b.articles.length)
    articlesHtml = '<div class="articles-section"><h3>📄 Extracted Articles ('+b.articles.length+')</h3>'+b.articles.map(a=>'<div class="article-card" onclick="selectArticle('+a.id+')"><div class="art-title">'+esc(a.title||'Untitled')+'</div><div class="art-domain">'+esc(a.domain||'')+'</div><div class="art-excerpt">'+esc(a.excerpt||'')+'</div><div class="art-meta"><span>'+esc(a.word_count||0)+' words</span></div></div>').join('')+'</div>';

  let tagsHtml = '';
  if (b.tags && b.tags.length) tagsHtml = '<div class="tag-row">'+b.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>';

  const e = b.engagement||{}; const engParts = [];
  if (e.likes) engParts.push('❤ '+Number(e.likes).toLocaleString());
  if (e.retweets) engParts.push('🔄 '+Number(e.retweets).toLocaleString());
  if (e.replies) engParts.push('💬 '+Number(e.replies).toLocaleString());
  if (e.views) engParts.push('👁 '+Number(e.views).toLocaleString());

  detail.innerHTML = '<div class="detail-top"><img class="avatar" src="'+esc(b.author_img||'')+'" onerror="this.style.display=\'none\'"><div><div class="name">'+esc(b.author_name||'Unknown')+'</div><div class="handle">@'+esc(b.author_handle||'')+'</div></div></div><div class="detail-text">'+linkify(esc(b.notes||b.text||''))+'</div><div class="triage-bar"><label>Status:</label><button class="status-badge '+(b.status||'new')+'" onclick="cycleStatus()">'+(b.status||'new')+'</button><label>Priority:</label><select onchange="updateField(\'priority\',this.value)"><option value="high"'+(b.priority==='high'?' selected':'')+'>🔴 High</option><option value="medium"'+(b.priority==='medium'?' selected':'')+'>🟡 Medium</option><option value="low"'+(b.priority==='low'?' selected':'')+'>⚪ Low</option></select><label>Category:</label><input type="text" id="catInput" value="'+esc(b.category||'')+'" placeholder="e.g. ai, frontend…" onchange="updateField(\'category\',this.value)" style="width:140px;"></div>'+quotedHtml+articlesHtml+mediaHtml+linksHtml+tagsHtml+'<div class="detail-meta">'+(b.posted_at?'<span>📅 '+esc(b.posted_at)+'</span>':'')+(engParts.length?'<span>'+engParts.join(' · ')+'</span>':'')+'<a href="'+esc(b.url)+'" target="_blank" rel="noopener">View on X →</a></div>';
  main.appendChild(detail);
}

async function selectArticle(id) {
  selectedId = id; renderList();
  const main = document.getElementById('mainPanel');
  main.querySelector('.detail')?.remove(); main.querySelector('.article-detail')?.remove(); main.querySelector('.article-grid')?.remove();
  document.getElementById('emptyState').style.display = 'none';
  try {
    const r = await fetch(API+'/api/articles/'+id);
    if (!r.ok) throw new Error();
    const a = await r.json();
    const ad = document.createElement('div'); ad.className = 'article-detail';
    ad.innerHTML = '<button class="back-btn" onclick="showArticleGrid()">← Back to articles</button><h2>'+esc(a.title||'Untitled')+'</h2><div class="art-source">'+esc(a.domain||'')+' · '+esc(a.word_count||0)+' words · <a href="'+esc(a.url)+'" target="_blank" rel="noopener">original →</a></div><div class="art-content">'+esc(a.content||'')+'</div>';
    main.appendChild(ad);
  } catch(e) { const el = document.createElement('div'); el.className='empty-state'; el.innerHTML='<p>Error loading article</p>'; main.appendChild(el); }
}

function showArticleGrid() {
  const main = document.getElementById('mainPanel');
  main.querySelector('.article-detail')?.remove();
  main.querySelector('.detail')?.remove();
  selectedId = null; renderList();
  if (!allArticles.length) return;
  const grid = document.createElement('div'); grid.className = 'article-grid';
  grid.innerHTML = allArticles.map(a => '<div class="article-card" onclick="selectArticle('+a.id+')"><div class="art-title">'+esc(a.title||'Untitled')+'</div><div class="art-domain">'+esc(a.domain||'')+'</div><div class="art-excerpt">'+esc(a.excerpt||'')+'</div><div class="art-meta"><span>'+esc(a.word_count||0)+' words</span></div></div>').join('');
  document.getElementById('emptyState').style.display = 'none';
  main.appendChild(grid);
}

async function cycleStatus() {
  const statuses = ['new','triaged','done'];
  const nxt = statuses[(statuses.indexOf(currentDetail.status||'new')+1)%statuses.length];
  await updateField('status', nxt);
  document.querySelector('.status-badge').className = 'status-badge '+nxt;
  document.querySelector('.status-badge').textContent = nxt;
}

async function updateField(field, value) {
  try { const r = await fetch(API+'/api/bookmarks/'+currentDetail.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({[field]:value})});
    if(r.ok) { currentDetail[field] = value; await loadBookmarks(); await loadStats(); renderList(); } }
  catch(e) { console.error(e); }
}

async function extractLink(bid, linkId, btn) {
  btn.classList.add('loading'); btn.textContent = '⏳';
  try { const r = await fetch(API+'/api/bookmarks/'+bid+'/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({link_id:linkId})});
    if(r.ok) { await loadBookmarks(); await loadArticles(); await loadStats();
      const b = allBookmarks.find(x=>x.id===bid); if(b) { currentDetail = b; renderBmDetail(); } renderList(); } }
  catch(e) { btn.classList.remove('loading'); btn.textContent = '📥 Extract'; }
}

function openLightbox(url) { document.getElementById('lightboxContent').innerHTML = '<img src="'+esc(url)+'">'; document.getElementById('lightbox').classList.add('open'); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); document.getElementById('lightboxContent').innerHTML = ''; }
function esc(s) { if(!s) return ''; const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
function linkify(t) { return t.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function debounce(fn,ms) { let t; return (...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms);}; }

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
